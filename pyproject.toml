[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-cortex"
dynamic = ["version"]
description = "Shared foundation for the Argus suite: taxonomy, versioned wire-schema tooling, and the local/remote AI backend contract"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
remote = ["httpx>=0.27"]
postgres = ["psycopg[binary,pool]>=3.1"]
qdrant = ["qdrant-client>=1.10"]
s3 = ["minio>=7.2"]
# The store drivers are in dev so each store's real client path (pool/enum/client
# construction, error wrapping) is exercised in CI, not just via fakes.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.15.16",
    "psycopg[binary,pool]>=3.1",
    "qdrant-client>=1.10",
    "minio>=7.2",
]

[project.urls]
Repository = "https://github.com/smk762/argus-cortex"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_cortex/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_cortex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_cortex/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
