name: Release to PyPI

# Top-level (non-reusable) on purpose: PyPI trusted publishing cannot run inside
# a reusable workflow. Keep this file in sync across the suite via `copier update`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install wheel and smoke-test import
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install dist/*.whl
          uv run --no-sync python -c "import argus_cortex; print(f'argus-cortex {argus_cortex.__version__} OK')"

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: test-install
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    runs-on: ubuntu-latest
    # Ordered *after* the TestPyPI rehearsal so its outcome is visible first, but
    # deliberately not gated on it. A TestPyPI-only fault — a missing trusted
    # publisher, an index outage — must not silently withhold the real release:
    # that failure mode shipped argus-proof images for two tags with no wheel on
    # PyPI, and nothing surfaced it because publish-image is independent.
    # Only the build + install gate is required; a TestPyPI failure still marks
    # the whole run failed, so the problem stays loud.
    needs: [test-install, publish-testpypi]
    if: "!cancelled() && needs.test-install.result == 'success'"
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # The GitHub Release is the last step, so it only appears once the version is
    # actually on PyPI. Its notes are this version's CHANGELOG.md section.
    # Gated on publish-pypi's own result, not the default success(): publish-pypi
    # runs even when the TestPyPI rehearsal failed, and that must not skip this.
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: "!cancelled() && needs.publish-pypi.result == 'success'"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, head) == 1 {found = 1; next} found && /^## \[/ {exit} found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*|*rc*|*a[0-9]*|*b[0-9]*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh notes and assets rather than failing.
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" --notes-file notes.md $prerelease
          fi

  dispatch-stages:
    # Each stage image installs argus-cortex at build time from its pyproject
    # range, so a new cortex only reaches running services once the images are
    # rebuilt. Tell the stages: their release.yml rebuilds the image of their
    # newest release on `cortex-released`. atlas and survey are left out on
    # purpose: they `uv sync --locked`, so a rebuild reinstalls the cortex their
    # lockfile pins — they need a lock bump, not a rebuild. quarry has no cortex.
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: "!cancelled() && needs.publish-pypi.result == 'success'"
    steps:
      - name: Wait until pip can resolve the new version
        # The upload is accepted before the simple index serves it; a stage
        # build that starts in that window would resolve the previous cortex.
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="argus_cortex-${version}-py3-none-any.whl"
          for _ in $(seq 60); do
            if curl -fsS https://pypi.org/simple/argus-cortex/ | grep -q "$wheel"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$wheel is not on the PyPI simple index after 10 minutes; no stage was told."
          exit 1
      - name: Dispatch cortex-released to the stages
        # A pre-release is skipped: no stage range admits one, so the rebuild
        # would reinstall the cortex already there.
        # SUITE_DISPATCH_TOKEN: a fine-grained PAT with Contents: read & write
        # on the repos below (GITHUB_TOKEN cannot reach another repo).
        env:
          GH_TOKEN: ${{ secrets.SUITE_DISPATCH_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in *-*|*rc*|*a[0-9]*|*b[0-9]*) echo "Pre-release $tag: not dispatching."; exit 0 ;; esac
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SUITE_DISPATCH_TOKEN is not set; no stage image was rebuilt for $tag."
            exit 1
          fi
          failed=0
          for repo in argus-curator argus-lens argus-proof argus-forge argus-darkroom; do
            if gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/dispatches" \
                -f event_type=cortex-released -f "client_payload[version]=${tag#v}"; then
              echo "Dispatched cortex-released to $repo"
            else
              echo "::error::Could not dispatch to $repo"
              failed=1
            fi
          done
          exit "$failed"
